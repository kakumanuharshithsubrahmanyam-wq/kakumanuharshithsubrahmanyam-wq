name: Build profile SVGs

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "fonts/**"
      - "assets/ascii-portrait.svg"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:
  schedule:
    # Refresh monthly in case generators or fonts change.
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow numpy

      - name: Rebuild SVG assets
        run: python tools/build_profile_svgs.py

      - name: Commit regenerated assets when they change
        run: |
          if git diff --quiet -- assets/*.svg; then
            echo "No SVG changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: regenerate profile SVG assets"
          git push
