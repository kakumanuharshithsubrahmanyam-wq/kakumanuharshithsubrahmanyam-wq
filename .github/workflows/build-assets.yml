name: Build Spider-Verse profile assets

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "fonts/**"
      - "assets/ascii-portrait.svg"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow numpy fonttools brotli

      - name: Rebuild Spider-Verse SVG assets
        run: |
          if [ -f tools/build_spiderverse.py ]; then
            python tools/build_spiderverse.py
          else
            python tools/build_profile_svgs.py
          fi

      - name: Commit regenerated assets when they change
        run: |
          if git diff --quiet -- assets/; then
            echo "No asset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: regenerate Spider-Verse profile SVG assets"
          git push
